name: Worker syntax check

on:
  pull_request:
    paths:
      - "worker.js"
      - ".github/workflows/worker-check.yml"
  push:
    branches:
      - "fix/worker-server-safety"
    paths:
      - "worker.js"
      - ".github/workflows/worker-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker syntax
        run: node --check --input-type=module < worker.js
