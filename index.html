async function A(action,args=[],timeoutMs=45000){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),timeoutMs);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args}),signal:ctl.signal});
    const text=await r.text(); let data;
    try{data=JSON.parse(text)}catch(e){throw new Error('서버 응답을 읽을 수 없습니다.')}
    if(!r.ok||data.ok===false)throw new Error(data.message||'요청 처리 중 오류가 발생했습니다.');
    return data;
  }catch(e){
    if(e?.name==='AbortError')throw new Error('서버 응답이 없습니다. 잠시 후 다시 시도해 주세요.');
    throw e;
  }finally{clearTimeout(timer)}
}

function driveFileId(url){
  const s=String(url||'');
  const m=s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)||s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m?m[1]:'';
}
function isPdfUrl(url,m){
  const type=String(m?.fileType||m?.mimeType||'').toLowerCase();
  const name=String(m?.fileName||'').toLowerCase();
  const u=String(url||'').toLowerCase();
  return type==='pdf'||type.includes('pdf')||name.endsWith('.pdf')||/\.pdf(?:[?#]|$)/i.test(u);
}

function formatCommentDate(v){
  const s=String(v??'').trim(); if(!s)return '';
  if(/^\d+(?:\.\d+)?$/.test(s)){
    const n=Number(s); if(Number.isFinite(n)){
      const d=new Date(Date.UTC(1899,11,30)+n*86400000);
      const p=x=>String(x).padStart(2,'0');
      return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());
    }
  }
  return s;
}

  box.innerHTML=list.length?list.map(c=>{

    return '<div class="comment-item"><div class="comment-top"><span class="comment-author">'+E(c.author||'회원')+'</span><span class="comment-date">'+E(when+(c.updatedAt?' (수정됨)':''))+'</span></div><div class="comment-text">'+E(c.text)+'</div>'+

      '</div>';

}

async function shareMaterial(id){
  if(!id)return;
  const url=new URL(window.location.href);
  url.searchParams.set('material',String(id));
  url.hash='';
  const shareUrl=url.toString();
  if(navigator.share){
    try{await navigator.share({title:document.querySelector('#materialViewer h2')?.textContent||'GMC Mission Archive 자료',text:'GMC 선교 자료를 공유합니다.',url:shareUrl});return}
    catch(e){if(e?.name==='AbortError')return}
  }
  const fallback=()=>{
    const input=document.createElement('textarea');
    input.value=shareUrl;input.setAttribute('readonly','');
    input.style.position='fixed';input.style.opacity='0';
    document.body.appendChild(input);input.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    input.remove();
    alert(ok?'자료 링크를 복사했습니다. 공유할 곳에 붙여넣으세요.':'링크를 복사하지 못했습니다. 주소를 직접 복사해 주세요.\n'+shareUrl);
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(shareUrl).then(()=>alert('자료 링크를 복사했습니다. 공유할 곳에 붙여넣으세요.')).catch(fallback);
  }else fallback();
}

function openMaterialById(id,url='',cardEl=null){
  if(!id && !url)return;
  const card=cardEl?.closest?.('.card')||cardEl;
  if(card){
    if(card.dataset.opening==='1')return;
    card.dataset.opening='1';
    card.classList.add('material-opening');
    card.setAttribute('aria-busy','true');
  }
  const done=()=>{
    if(card){
      card.dataset.opening='0';
      card.classList.remove('material-opening');
      card.removeAttribute('aria-busy');
    }
  };
  const title=card?.querySelector?.('h3')?.textContent||'자료';
  const desc=card?.querySelector?.('p')?.textContent||'';
  const link=url||'';
  const loadDetail=()=>{
    if(!id)return Promise.resolve();
    return A('getMaterial',[T,id]).then(d=>{
      const m=d.material||d.item||d.data||d;
      const viewer=document.getElementById('materialViewer');
      if(!viewer)return;
      showMaterialViewer(m,m.url||m.viewUrl||m.driveUrl||m.webViewLink||m.downloadUrl||link,id);
    }).catch(e=>{
      if(document.getElementById('materialViewer')&&!link)alert(e.message||'자료 정보를 불러오지 못했습니다.');
    });
  };
  if(link){
    showMaterialViewer({title,description:desc},link,id);
    loadDetail().finally(done);
    return;
  }
  if(id){
    showMaterialViewer({title,description:desc},'',id);
    loadDetail().then(()=>{
      const viewer=document.getElementById('materialViewer');
      if(viewer&&!viewer.querySelector('.material-original-link')&&viewer.querySelector('.viewer-actions a'))viewer.querySelector('.viewer-actions a').classList.add('material-original-link');
    }).finally(done);
  }else{
    done();
  }
}

async function search(category, restoring=false){
  const state=readSearchState();
  if(category!==undefined)state.category=category||'';
  if(state.category===undefined)state.category='';
  const q=(document.getElementById('q')?.value||state.q||'').trim();
  state.q=q;
  const cards=document.getElementById('cards'), count=document.getElementById('heroResultCount');
  const sortSelect=document.getElementById('searchSort');
  const languageSelect=document.getElementById('filterLanguage');
  const yearSelect=document.getElementById('filterYear');
  if(sortSelect&&state.sort)sortSelect.value=state.sort;
  if(languageSelect&&state.language)languageSelect.value=state.language;
  if(yearSelect&&state.year)yearSelect.value=state.year;
  window.__gmcSearchState=state;
  if(!restoring)persistSearchState();
  if(!cards)return;
  cards.innerHTML='<div class="notice">검색 중...</div>';
  try{
    const d=await A('listMaterials',[T,{q,category:state.category}]);
    let items=d.materials||d.items||d.data||[];
    if(!Array.isArray(items))items=[];
    const languageOf=m=>String(m.language||m.lang||m.langauge||m['언어']||'').trim();
    const yearOf=m=>{const v=String(m.year||m['작성연도']||'').trim();const match=v.match(/(19|20)[0-9]{2}/);return match?match[0]:''};
    const languages=[...new Set(items.map(languageOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    const years=[...new Set(items.map(yearOf).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
    if(languageSelect){
      const selected=state.language||languageSelect.value||'';
      languageSelect.innerHTML='<option value="">전체 언어</option>'+languages.map(v=>'<option value="'+E(v)+'">'+E(v)+'</option>').join('');
      languageSelect.value=languages.includes(selected)?selected:'';
      state.language=languageSelect.value;
    }
    if(yearSelect){
      const selected=state.year||yearSelect.value||'';
      yearSelect.innerHTML='<option value="">전체 연도</option>'+years.map(v=>'<option value="'+E(v)+'">'+E(v)+'년</option>').join('');
      yearSelect.value=years.includes(selected)?selected:'';
      state.year=yearSelect.value;
    }
    if(languageSelect?.value)items=items.filter(m=>languageOf(m)===languageSelect.value);
    if(yearSelect?.value)items=items.filter(m=>yearOf(m)===yearSelect.value);
    const sort=sortSelect?.value||state.sort||(q?'related':'date');
    if(sortSelect)sortSelect.value=sort;
    state.q=q;state.sort=sort;window.__gmcSearchState=state;
    try{sessionStorage.setItem('gmcArchiveSearchState',JSON.stringify(state))}catch(e){}
    items=[...items];
    items.sort((a,b)=>{
      if(sort==='title')return String(a.title||a.name||'').localeCompare(String(b.title||b.name||''),'ko');
      if(sort==='views')return Number(b.views||0)-Number(a.views||0);
      if(sort==='comments')return Number(b.commentCount||0)-Number(a.commentCount||0);
      if(sort==='year')return Number(b.year||0)-Number(a.year||0);
      if(sort==='date'){
        const timestamp=v=>{
          if(v===null||v===undefined||String(v).trim()==='')return null;
          const raw=String(v).trim();let t=Date.parse(raw);
          if(Number.isFinite(t))return t;
          const m=raw.match(/^(\\d{4})[./-](\\d{1,2})[./-](\\d{1,2})(?:\\s+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?)?$/);
          if(m){t=Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));return Number.isFinite(t)?t:null}
          return null;
        };
        const da=timestamp(a.date||a.createdAt),db=timestamp(b.date||b.createdAt);
        if(da===null&&db===null)return 0;if(da===null)return 1;if(db===null)return -1;return db-da;
      }
      return 0;
    });
    if(count){
      const parts=[];
      if(q)parts.push("'"+q+"' 검색");
      if(state.category)parts.push(state.category);
      if(state.language)parts.push(state.language);
      if(state.year)parts.push(state.year+'년');
      count.textContent=(parts.length?parts.join(' · ')+' 결과 ':'전체 자료 ')+items.length+'건';
    }
    if(!items.length){cards.innerHTML='<div class="notice">조건에 맞는 자료가 없습니다. 필터를 바꾸거나 초기화해 보세요.</div>';return}
    cards.innerHTML=items.map(m=>`
      <article class="card" style="cursor:pointer" onclick="openMaterialById('${E(m.id||m.materialId||m.ID||'').replace(/'/g,"&#039;")}','${E(m.url||m.viewUrl||m.driveUrl||m.webViewLink||'').replace(/'/g,"&#039;")}',this)">
        <div class="card-top"><div class="tag">${E(m.category||'기타')}</div><button class="favorite-btn ${FAVS.has(String(m.id||m.materialId||m.ID||''))?'active':''}" title="${FAVS.has(String(m.id||m.materialId||m.ID||''))?'내 보관함에서 제거':'내 보관함에 저장'}" onclick="event.stopPropagation();toggleFavorite('${E(m.id||m.materialId||m.ID||'').replace(/'/g,"&#039;")}',this)">${FAVS.has(String(m.id||m.materialId||m.ID||''))?'★':'☆'}</button></div>
        <h3>${E(m.title||m.name||'제목 없음')}</h3>
        <p>${E(m.description||m.content||'')}</p>
        <div class="meta">${E(m.author||m.writer||'')} ${m.year?'· '+E(m.year):''} · 조회 ${Number(m.views||0)} · 댓글 ${Number(m.commentCount||0)}</div>
      </article>`).join('');
    const sharedId=new URLSearchParams(window.location.search).get('material');
    if(sharedId&&!window.__gmcSharedMaterialOpened){
      const match=items.find(m=>String(m.id||m.materialId||m.ID||'')===String(sharedId));
      if(match){window.__gmcSharedMaterialOpened=true;openMaterialById(String(sharedId),match.url||match.viewUrl||match.driveUrl||match.webViewLink||'',null)}
    }
  }catch(e){if(count)count.textContent='';cards.innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}

function filterAdminMaterials(){
  const q=(document.getElementById('adminMaterialQ')?.value||'').trim().toLowerCase();
  const cat=document.getElementById('adminMaterialCategory')?.value||'',st=document.getElementById('adminMaterialStatus')?.value||'',sort=document.getElementById('adminMaterialSort')?.value||'date';
  const list=ADMIN_MATERIALS.filter(m=>(!q||[m.title,m.author,m.fileName].join(' ').toLowerCase().includes(q))&&(!cat||categoryList(m.category).includes(cat))&&(!st||m.status===st));
  list.sort((a,b)=>{
    if(sort==='title')return String(a.title||'').localeCompare(String(b.title||''),'ko');
    if(sort==='views')return Number(b.views||0)-Number(a.views||0);
    if(sort==='year')return Number(b.year||0)-Number(a.year||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  renderAdminMaterials(list);
}

function detectFileType(file){
  const mime=(file?.type||'').toLowerCase(), ext=(file?.name||'').split('.').pop().toLowerCase();
  if(mime==='application/pdf'||ext==='pdf')return 'PDF';
  if(mime.includes('presentation')||['ppt','pptx','key'].includes(ext))return 'PPT';
  if(mime.includes('word')||['doc','docx','hwp','hwpx'].includes(ext))return 'DOC';
  if(mime.includes('spreadsheet')||['xls','xlsx','csv'].includes(ext))return 'Excel';
  if(mime.startsWith('image/')||['jpg','jpeg','png','gif','webp','svg'].includes(ext))return '사진';
  if(mime.startsWith('video/')||['mp4','mov','avi','mkv','webm'].includes(ext))return '영상';
  if(mime.startsWith('audio/')||['mp3','wav','m4a','aac'].includes(ext))return '음성';
  if(mime.includes('zip')||['zip','rar','7z'].includes(ext))return '압축파일';
  return ext?ext.toUpperCase():'기타';
}
async function directDriveUpload(file,uploadUrl,msg){
  if(!uploadUrl)throw new Error('Google Drive 업로드 주소를 받지 못했습니다.');
  const chunkSize=3*1024*1024;
  let start=0;
  while(start<file.size){
    const end=Math.min(start+chunkSize,file.size),chunk=file.slice(start,end);
    msg.innerHTML=`<div class="notice">Google Drive에 업로드 중입니다... ${Math.round(start/file.size*100)}%</div>`;
    const proxy='/api?upload=1&url='+encodeURIComponent(uploadUrl);
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),90000);
    let r;
    try{
      r=await fetch(proxy,{method:'POST',headers:{'Content-Range':`bytes ${start}-${end-1}/${file.size}`},body:chunk,signal:ctl.signal});
    }catch(err){
      if(err?.name==='AbortError')throw new Error('파일 업로드 응답이 없습니다. 네트워크 연결을 확인해 주세요.');
      throw err;
    }finally{clearTimeout(timer)}
    if(r.status===200||r.status===201){
      let d=null;try{d=await r.json()}catch(_){}
      msg.innerHTML='<div class="notice">Google Drive 업로드 완료</div>';
      return d;
    }
    if(r.status!==308){
      let t='';try{t=await r.text()}catch(_){}
      throw new Error(t||`Google Drive 업로드 오류 (HTTP ${r.status})`);
    }
    const range=r.headers.get('Range')||r.headers.get('range')||'';
    const m=range.match(/-(\\d+)$/);
    start=m?Number(m[1])+1:end;
    msg.innerHTML=`<div class="notice">Google Drive에 업로드 중입니다... ${Math.round(start/file.size*100)}%</div>`;
  }
  return null;
}

async function upload(){
  const f=document.getElementById('file').files[0],msg=document.getElementById('uploadmsg');
  if(!f){msg.innerHTML='<div class="notice error">파일을 선택하세요.</div>';return}
  if(f.size>5*1024*1024*1024){msg.innerHTML='<div class="notice error">파일은 5GB 이하로 올려주세요.</div>';return}
  const btn=document.querySelector('button[onclick="upload()"]');
  if(btn){btn.disabled=true;btn.textContent='업로드 중...'}
  msg.innerHTML='<div class="notice">1/3 업로드를 준비하고 있습니다...</div>';
  try{
    const meta={fileName:f.name,mimeType:f.type||'application/octet-stream',size:f.size,fileType:detectFileType(f)};
    const session=await A('prepareUpload',[T,meta],45000);
    const uploadUrl=session.uploadUrl||session.uploadURL||session.url||session.location;
    if(!uploadUrl)throw new Error('업로드 주소가 없습니다. 서버의 업로드 준비 응답을 확인해야 합니다.');
    msg.innerHTML='<div class="notice">2/3 Google Drive에 파일을 업로드하고 있습니다... 0%</div>';
    const direct=await directDriveUpload(f,uploadUrl,msg);
    msg.innerHTML='<div class="notice">3/3 등록 정보를 저장하고 있습니다...</div>';
    await A('finalizeUpload',[T,{
      title:document.getElementById('mt').value,
      description:document.getElementById('md').value,
      category:selectedCategories('mc'),
      language:document.getElementById('ml').value,
      author:document.getElementById('ma').value,
      year:document.getElementById('my').value,
      fileType:detectFileType(f),
      fileName:f.name,
      size:f.size,
      uploadId:session.uploadId||session.id||'',
      driveId:direct?.id||direct?.fileId||''
    }],45000);
    msg.innerHTML='<div class="notice ok">등록되었습니다.</div>';
    alert('자료가 등록되었습니다.');
    await home();
  }catch(e){
    msg.innerHTML='<div class="notice error">업로드에 실패했습니다.<br>'+E(e.message||'알 수 없는 오류')+'</div>';
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Drive에 저장하고 등록'}
  }
}
