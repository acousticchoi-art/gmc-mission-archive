function driveFileId(url){
  const s=String(url||'');
  const m=s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)||s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m?m[1]:'';
}
function isPdfUrl(url,m){
  const type=String(m?.fileType||m?.mimeType||'').toLowerCase();
  const name=String(m?.fileName||'').toLowerCase();
  const u=String(url||'').toLowerCase();
  return type==='pdf'||type.includes('pdf')||name.endsWith('.pdf')||/\.pdf(?:[?#]|$)/i.test(u);
}

function formatCommentDate(v){
  const s=String(v??'').trim(); if(!s)return '';
  if(/^\d+(?:\.\d+)?$/.test(s)){
    const n=Number(s); if(Number.isFinite(n)){
      const d=new Date(Date.UTC(1899,11,30)+n*86400000);
      const p=x=>String(x).padStart(2,'0');
      return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());
    }
  }
  return s;
}

async function shareMaterial(id){

    try{await navigator.share({title:document.querySelector('#materialViewer h2')?.textContent||'GMC Mission Archive 자료',text:'GMC 선교 자료를 공유합니다.',url:shareUrl});return}
    catch(e){if(e?.name==='AbortError')return}
  }
  const fallback=()=>{
    const input=document.createElement('textarea');
    input.value=shareUrl;input.setAttribute('readonly','');
    input.style.position='fixed';input.style.opacity='0';
    document.body.appendChild(input);input.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    input.remove();
    alert(ok?'자료 링크를 복사했습니다. 공유할 곳에 붙여넣으세요.':'링크를 복사하지 못했습니다. 주소를 직접 복사해 주세요.\n'+shareUrl);
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(shareUrl).then(()=>alert('자료 링크를 복사했습니다. 공유할 곳에 붙여넣으세요.')).catch(fallback);
  }else fallback();
}

function openMaterialById(id,url='',cardEl=null){
  if(!id && !url)return;
  const card=cardEl?.closest?.('.card')||cardEl;
  if(card){
    if(card.dataset.opening==='1')return;
    card.dataset.opening='1';
    card.classList.add('material-opening');
    card.setAttribute('aria-busy','true');
  }
  const done=()=>{
    if(card){
      card.dataset.opening='0';
      card.classList.remove('material-opening');
      card.removeAttribute('aria-busy');
    }
  };
  const title=card?.querySelector?.('h3')?.textContent||'자료';
  const desc=card?.querySelector?.('p')?.textContent||'';
  const link=url||'';
  const loadDetail=()=>{
    if(!id)return Promise.resolve();
    return A('getMaterial',[T,id]).then(d=>{
      const m=d.material||d.item||d.data||d;
      const viewer=document.getElementById('materialViewer');
      if(!viewer)return;
      showMaterialViewer(m,m.url||m.viewUrl||m.driveUrl||m.webViewLink||m.downloadUrl||link,id);
    }).catch(e=>{
      if(document.getElementById('materialViewer')&&!link)alert(e.message||'자료 정보를 불러오지 못했습니다.');
    });
  };
  if(link){
    showMaterialViewer({title,description:desc},link,id);
    loadDetail().finally(done);
    return;
  }
  if(id){
    showMaterialViewer({title,description:desc},'',id);
    loadDetail().then(()=>{
      const viewer=document.getElementById('materialViewer');
      if(viewer&&!viewer.querySelector('.material-original-link')&&viewer.querySelector('.viewer-actions a'))viewer.querySelector('.viewer-actions a').classList.add('material-original-link');
    }).finally(done);
  }else{
    done();
  }
}

function readSearchState(){

function persistSearchState(){

}
function restoreSearchState(){

async function search(category, restoring=false){
  const state=readSearchState();
  if(category!==undefined)state.category=category||'';
  if(state.category===undefined)state.category='';
  const q=(document.getElementById('q')?.value||state.q||'').trim();
  state.q=q;
  const cards=document.getElementById('cards'), count=document.getElementById('heroResultCount');
  const sortSelect=document.getElementById('searchSort');
  const languageSelect=document.getElementById('filterLanguage');
  const yearSelect=document.getElementById('filterYear');
  if(sortSelect&&state.sort)sortSelect.value=state.sort;
  if(languageSelect&&state.language)languageSelect.value=state.language;
  if(yearSelect&&state.year)yearSelect.value=state.year;
  window.__gmcSearchState=state;
  if(!restoring)persistSearchState();
  if(!cards)return;
  cards.innerHTML='<div class="notice">검색 중...</div>';
  try{
    const d=await A('listMaterials',[T,{q,category:state.category}]);
    let items=d.materials||d.items||d.data||[];
    if(!Array.isArray(items))items=[];
    const languageOf=m=>String(m.language||m.lang||m.langauge||m['언어']||'').trim();
    const yearOf=m=>{const v=String(m.year||m['작성연도']||'').trim();const match=v.match(/(19|20)[0-9]{2}/);return match?match[0]:''};
    const languages=[...new Set(items.map(languageOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
    const years=[...new Set(items.map(yearOf).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
    if(languageSelect){
      const selected=state.language||languageSelect.value||'';
      languageSelect.innerHTML='<option value="">전체 언어</option>'+languages.map(v=>'<option value="'+E(v)+'">'+E(v)+'</option>').join('');
      languageSelect.value=languages.includes(selected)?selected:'';
      state.language=languageSelect.value;
    }
    if(yearSelect){
      const selected=state.year||yearSelect.value||'';
      yearSelect.innerHTML='<option value="">전체 연도</option>'+years.map(v=>'<option value="'+E(v)+'">'+E(v)+'년</option>').join('');
      yearSelect.value=years.includes(selected)?selected:'';
      state.year=yearSelect.value;
    }
    if(languageSelect?.value)items=items.filter(m=>languageOf(m)===languageSelect.value);
    if(yearSelect?.value)items=items.filter(m=>yearOf(m)===yearSelect.value);
    const sort=sortSelect?.value||state.sort||(q?'related':'date');
    if(sortSelect)sortSelect.value=sort;
    state.q=q;state.sort=sort;window.__gmcSearchState=state;
    try{sessionStorage.setItem('gmcArchiveSearchState',JSON.stringify(state))}catch(e){}
    items=[...items];
    items.sort((a,b)=>{
      if(sort==='title')return String(a.title||a.name||'').localeCompare(String(b.title||b.name||''),'ko');
      if(sort==='views')return Number(b.views||0)-Number(a.views||0);
      if(sort==='comments')return Number(b.commentCount||0)-Number(a.commentCount||0);
      if(sort==='year')return Number(b.year||0)-Number(a.year||0);
      if(sort==='date'){
        const timestamp=v=>{
          if(v===null||v===undefined||String(v).trim()==='')return null;
          const raw=String(v).trim();let t=Date.parse(raw);
          if(Number.isFinite(t))return t;
          const m=raw.match(/^(\\d{4})[./-](\\d{1,2})[./-](\\d{1,2})(?:\\s+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?)?$/);
          if(m){t=Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0));return Number.isFinite(t)?t:null}
          return null;
        };
        const da=timestamp(a.date||a.createdAt),db=timestamp(b.date||b.createdAt);
        if(da===null&&db===null)return 0;if(da===null)return 1;if(db===null)return -1;return db-da;
      }
      return 0;
    });
    if(count){
      const parts=[];
      if(q)parts.push("'"+q+"' 검색");
      if(state.category)parts.push(state.category);
      if(state.language)parts.push(state.language);
      if(state.year)parts.push(state.year+'년');
      count.textContent=(parts.length?parts.join(' · ')+' 결과 ':'전체 자료 ')+items.length+'건';
    }
    if(!items.length){cards.innerHTML='<div class="notice">조건에 맞는 자료가 없습니다. 필터를 바꾸거나 초기화해 보세요.</div>';return}
    cards.innerHTML=items.map(m=>`
      <article class="card" style="cursor:pointer" onclick="openMaterialById('${E(m.id||m.materialId||m.ID||'').replace(/'/g,"&#039;")}','${E(m.url||m.viewUrl||m.driveUrl||m.webViewLink||'').replace(/'/g,"&#039;")}',this)">
        <div class="card-top"><div class="tag">${E(m.category||'기타')}</div><button class="favorite-btn ${FAVS.has(String(m.id||m.materialId||m.ID||''))?'active':''}" title="${FAVS.has(String(m.id||m.materialId||m.ID||''))?'내 보관함에서 제거':'내 보관함에 저장'}" onclick="event.stopPropagation();toggleFavorite('${E(m.id||m.materialId||m.ID||'').replace(/'/g,"&#039;")}',this)">${FAVS.has(String(m.id||m.materialId||m.ID||''))?'★':'☆'}</button></div>
        <h3>${E(m.title||m.name||'제목 없음')}</h3>
        <p>${E(m.description||m.content||'')}</p>
        <div class="meta">${E(m.author||m.writer||'')} ${m.year?'· '+E(m.year):''} · 조회 ${Number(m.views||0)} · 댓글 ${Number(m.commentCount||0)}</div>
      </article>`).join('');
    const sharedId=new URLSearchParams(window.location.search).get('material');
    if(sharedId&&!window.__gmcSharedMaterialOpened){
      const match=items.find(m=>String(m.id||m.materialId||m.ID||'')===String(sharedId));
      if(match){window.__gmcSharedMaterialOpened=true;openMaterialById(String(sharedId),match.url||match.viewUrl||match.driveUrl||match.webViewLink||'',null)}
    }
  }catch(e){if(count)count.textContent='';cards.innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}

function opsDateIso(value){
  const raw=String(value||'').trim();if(!raw)return '';
  const m=raw.match(/(20\d{2})[./년 -]\s*(\d{1,2})[./월 -]\s*(\d{1,2})/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  const d=new Date(raw);if(isNaN(d))return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function inspectRestoreFile(input){
  const out=document.getElementById('restorePreview'),btn=document.getElementById('restoreRun');RESTORE_BACKUP_DATA=null;btn.disabled=true;
  const file=input.files&&input.files[0];if(!file){out.textContent='백업 파일을 선택하세요.';return;}

    try{
      const b=JSON.parse(String(reader.result||''));
      if(b.format!=='GMC-Mission-Archive-Backup'||b.version!==1||!b.sheets)throw new Error('GMC 아카이브 백업 파일이 아닙니다.');
      const names=['회원','자료','즐겨찾기','댓글','최근본자료','로그인이력'];
      for(const n of names)if(!Array.isArray(b.sheets[n])||!b.sheets[n].length||!Array.isArray(b.sheets[n][0]))throw new Error('필수 시트가 없거나 손상되었습니다: '+n);

      out.innerHTML='<b>백업 파일 확인 완료</b><br>생성일: '+E(b.createdAt||'알 수 없음')+'<br>'+names.map(n=>E(n)+': '+Math.max(0,b.sheets[n].length-1)+'개 행').join('<br>')+'<br><br>현재 데이터 개수를 확인하는 중...';
      const st=await A('backupStatus',[T]);

      btn.disabled=false;
    }catch(e){out.textContent='파일 확인 실패: '+(e.message||e);}
  };reader.onerror=()=>{out.textContent='파일을 읽을 수 없습니다.';};reader.readAsText(file,'UTF-8');
}

  <div class="panel"><div class="admin-material-tools"><input id="adminMaterialQ" placeholder="제목, 저자, 파일명 검색" oninput="filterAdminMaterials()"><select id="adminMaterialCategory" onchange="filterAdminMaterials()"><option value="">전체 분야</option>${(CATS||[]).map(c=>`<option value="${E(c)}">${E(c)}</option>`).join('')}</select><select id="adminMaterialStatus" onchange="filterAdminMaterials()"><option value="">전체 상태</option><option value="공개">공개</option><option value="비공개">비공개</option></select></div><div class="admin-material-result-head"><span id="adminMaterialCount">검색 결과</span><select id="adminMaterialSort" onchange="filterAdminMaterials()"><option value="date">최신 등록순</option><option value="title">제목순</option><option value="views">조회수순</option><option value="year">작성연도순</option></select></div><div id="adminMaterials"><div class="notice">자료를 불러오는 중...</div></div></div></div>`;
  loadAdminMaterials();
}
let ADMIN_MATERIALS=[];
async function loadAdminMaterials(){
  const box=document.getElementById('adminMaterials'); if(!box)return;
  try{const d=await A('adminMaterials',[T]);ADMIN_MATERIALS=d.materials||[];renderAdminMaterials(ADMIN_MATERIALS);}
  catch(e){box.innerHTML='<div class="notice error">'+E(e.message)+'</div>';}
}
function filterAdminMaterials(){
  const q=(document.getElementById('adminMaterialQ')?.value||'').trim().toLowerCase();
  const cat=document.getElementById('adminMaterialCategory')?.value||'',st=document.getElementById('adminMaterialStatus')?.value||'',sort=document.getElementById('adminMaterialSort')?.value||'date';
  const list=ADMIN_MATERIALS.filter(m=>(!q||[m.title,m.author,m.fileName].join(' ').toLowerCase().includes(q))&&(!cat||categoryList(m.category).includes(cat))&&(!st||m.status===st));
  list.sort((a,b)=>{
    if(sort==='title')return String(a.title||'').localeCompare(String(b.title||''),'ko');
    if(sort==='views')return Number(b.views||0)-Number(a.views||0);
    if(sort==='year')return Number(b.year||0)-Number(a.year||0);
    return String(b.date||'').localeCompare(String(a.date||''));
  });
  renderAdminMaterials(list);
}
function renderAdminMaterials(list){
  const box=document.getElementById('adminMaterials');if(!box)return;
  const count=document.getElementById('adminMaterialCount');if(count)count.textContent='검색 결과 '+list.length+'건';
  if(!list.length){box.innerHTML='<div class="notice">조건에 맞는 자료가 없습니다.</div>';return;}
  box.innerHTML=list.map(m=>`<div class="admin-material-row">
    <div class="admin-material-main"><div class="tag">${E(m.category||'기타')}</div><h3>${E(m.title||'제목 없음')}</h3><p>${E(m.author||'저자 미상')} · ${E(m.year||'연도 미상')} · 조회 ${Number(m.views||0)}</p><small>${E(m.fileName||'')}</small></div>
    <div class="admin-material-meta"><span class="admin-status ${m.status==='공개'?'is-public':m.status==='비공개'?'is-private':'is-deleted'}">${E(m.status||'')}</span><div class="admin-material-actions"><button class="btn light" onclick="editMaterialAdmin('${E(String(m.id||'')).replace(/'/g,"&#039;")}')">수정</button>${m.driveId?'<a class="btn light" target="_blank" rel="noopener" href="https://drive.google.com/file/d/'+encodeURIComponent(m.driveId)+'/view">원본</a>':''}<button class="btn danger" onclick="deleteMaterialAdmin('${E(String(m.id||'')).replace(/'/g,"&#039;")}','${E(m.title||'').replace(/'/g,"&#039;")}')">삭제</button></div></div>
  </div>`).join('');
}

async function saveMaterialAdmin(id){
  const data={title:document.getElementById('ame_title').value,description:document.getElementById('ame_desc').value,category:selectedCategories('ame_cat'),language:document.getElementById('ame_lang').value,author:document.getElementById('ame_author').value,year:document.getElementById('ame_year').value,fileType:document.getElementById('ame_type').value,status:document.getElementById('ame_status').value};
  try{await A('updateMaterial',[T,id,data]);document.getElementById('ame_msg').innerHTML='<div class="notice ok">변경사항이 저장되었습니다.</div>';await loadAdminMaterials();}
  catch(e){document.getElementById('ame_msg').innerHTML='<div class="notice error">'+E(e.message)+'</div>';}
}
async function deleteMaterialAdmin(id,title){
  if(!confirm('자료를 삭제하시겠습니까?\n\n'+title+'\n\n삭제하면 Google Drive 원본도 휴지통으로 이동합니다.'))return;
  try{await A('deleteMaterial',[T,id]);alert('자료가 삭제되었습니다.');await loadAdminMaterials();}
  catch(e){alert(e.message);}
}

function showMemberAdminTab(tab){
  const register=tab==='register';
  const registerPanel=document.getElementById('memberRegisterPanel');
  const managePanel=document.getElementById('memberManagePanel');
  const registerButton=document.getElementById('memberTabRegister');
  const manageButton=document.getElementById('memberTabManage');
  if(!registerPanel||!managePanel)return;
  registerPanel.hidden=!register;managePanel.hidden=register;
  registerButton?.classList.toggle('active',register);
  manageButton?.classList.toggle('active',!register);
  registerButton?.setAttribute('aria-selected',String(register));
  manageButton?.setAttribute('aria-selected',String(!register));
  if(!register&&!window.__memberAdminLoaded){window.__memberAdminLoaded=true;loadUsers();}
}

let ADMIN_USERS=[];
async function loadUsers(){
  const el=document.getElementById('users');if(!el)return;
  el.innerHTML='<div class="notice">회원 목록을 불러오는 중...</div>';
  try{
    const r=await A('listUsers',[T]);
    ADMIN_USERS=r.users||r.items||r.data||[];
    window.__memberAdminLoaded=true;
    const tabCount=document.getElementById('memberTabCount');if(tabCount)tabCount.textContent=' '+ADMIN_USERS.length;
    filterUsers();
  }catch(e){el.innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}
function filterUsers(){
  const q=(document.getElementById('memberSearch')?.value||'').trim().toLocaleLowerCase();
  const status=document.getElementById('memberStatusFilter')?.value||'';
  const role=document.getElementById('memberRoleFilter')?.value||'';
  const users=ADMIN_USERS.filter(u=>
    (!q||[u.name,u.username,u.email,u.branch].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&
    (!status||u.status===status)&&(!role||u.role===role)
  ).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
  renderUsers(users);
}
function renderUsers(users){
  const el=document.getElementById('users');if(!el)return;
  if(!users.length){
    el.innerHTML='<div class="notice">'+(ADMIN_USERS.length?'검색 조건에 맞는 회원이 없습니다.':'등록된 회원이 없습니다.')+'</div>';
    return;
  }
  el.innerHTML=`
    <div class="member-list-wrap">
      <div class="member-list-head"><span>회원 목록</span><span class="member-list-count">${users.length}명 표시 / 전체 ${ADMIN_USERS.length}명</span></div>
      ${users.map(u=>{
        const id=E(u.id||'').replace(/'/g,"&#039;");
        const active=u.status==='활성';
        return `
          <div class="member-row">
            <div class="member-main member-cell">
              <div><div class="member-name">${E(u.name||'-')}</div><div class="member-id">${E(u.username||'-')}</div></div>
              <span class="member-status ${active?'active':'inactive'}">${E(u.status||'-')}</span>
            </div>
            <div class="member-cell member-email" title="${E(u.email||'')}">${E(u.email||'-')}</div>
            <div class="member-cell member-role">${E(u.role||'-')}</div>
            <div class="member-cell member-branch">${E(u.branch||'-')}</div>
            <div class="member-actions">
              <button class="btn light" onclick="editUser('${id}')">수정</button>
              <button class="btn light" onclick="resetMemberPassword('${id}','${E(u.name||u.username||'회원').replace(/'/g,"&#039;")}')">비밀번호 초기화</button>
              <button class="btn light" onclick="toggleUser('${id}','${active?'비활성':'활성'}')">${active?'비활성화':'활성화'}</button>
            </div>
            <div class="member-details">
              <div class="member-detail"><span class="member-detail-label">이메일</span><span class="member-detail-value">${E(u.email||'-')}</span></div>
              <div class="member-detail"><span class="member-detail-label">권한</span><span class="member-detail-value">${E(u.role||'-')}</span></div>
              <div class="member-detail"><span class="member-detail-label">소속 지부</span><span class="member-detail-value">${E(u.branch||'-')}</span></div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

}
async function loadLoginHistory(){
  const target=document.getElementById('loginHistory');
  if(!target)return;
  target.innerHTML='<div class="notice">불러오는 중...</div>';
  try{
    const r=await A('loginHistory',[T]);
    const rows=r.history||[];
    target.innerHTML=rows.length
      ? `<div class="login-history-scroll" style="width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px"><table style="width:100%;min-width:720px;table-layout:auto;border-collapse:collapse;font-size:14px"><thead><tr><th style="text-align:left;padding:12px;white-space:nowrap;background:#f7f9fa;border-bottom:1px solid var(--line)">로그인 시간</th><th style="text-align:left;padding:12px;white-space:nowrap;background:#f7f9fa;border-bottom:1px solid var(--line)">이름</th><th style="text-align:left;padding:12px;white-space:nowrap;background:#f7f9fa;border-bottom:1px solid var(--line)">아이디</th><th style="text-align:left;padding:12px;white-space:nowrap;background:#f7f9fa;border-bottom:1px solid var(--line)">권한</th><th style="text-align:left;padding:12px;white-space:nowrap;background:#f7f9fa;border-bottom:1px solid var(--line)">지부</th></tr></thead><tbody>${rows.map(x=>`<tr><td style="padding:12px;white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)">${E(x.loginAt||'-')}</td><td style="padding:12px;white-space:nowrap;border-bottom:1px solid var(--line)">${E(x.name||'-')}</td><td style="padding:12px;white-space:nowrap;border-bottom:1px solid var(--line)">${E(x.username||'-')}</td><td style="padding:12px;white-space:nowrap;border-bottom:1px solid var(--line)">${E(x.role||'-')}</td><td style="padding:12px;white-space:nowrap;border-bottom:1px solid var(--line)">${E(x.branch||'-')}</td></tr>`).join('')}</tbody></table></div><div class="meta" style="margin-top:8px">모바일에서는 표를 좌우로 밀어 전체 항목을 확인할 수 있습니다.</div>`
      : '<div class="notice">로그인 이력이 없습니다.</div>';

async function createUser(){
  const data={name:document.getElementById('un').value,username:document.getElementById('uid').value,email:document.getElementById('ue').value,branch:document.getElementById('ub').value,role:document.getElementById('ur').value,initialPassword:document.getElementById('up').value};
  try{await A('createUser',[T,data]);document.getElementById('umsg').innerHTML='<div class="notice ok">회원이 등록되었습니다.</div>';window.__memberAdminLoaded=false;ADMIN_USERS=[];if(document.getElementById('memberTabCount'))document.getElementById('memberTabCount').textContent='';userAdmin('manage');}
  catch(e){document.getElementById('umsg').innerHTML='<div class="notice error">'+E(e.message)+'</div>'}

async function toggleUser(id,status){
  if(!confirm(status==='비활성'?'이 회원을 비활성화할까요?':'이 회원을 다시 활성화할까요?'))return;
  try{
    await A('updateUser',[T,{id,status}]);
    await loadUsers();
  }catch(e){alert(e.message)}
}
async function resetMemberPassword(id,name){
  if(!confirm(name+' 회원의 비밀번호를 초기화할까요? 초기화 후 해당 회원은 임시 비밀번호로 로그인해야 합니다.'))return;
  const password=prompt('임시 비밀번호를 입력하세요. 6자 이상으로 설정하세요.');
  if(password===null)return;
  if(password.length<6){alert('비밀번호는 6자 이상이어야 합니다.');return;}
  try{
    await A('resetUserPassword',[T,id,password]);
    alert('비밀번호가 초기화되었습니다.\n\n회원에게 임시 비밀번호를 안전하게 전달해 주세요. 회원은 로그인 후 새 비밀번호를 설정해야 합니다.');
  }catch(e){alert('비밀번호 초기화 실패: '+e.message)}
}

async function saveUser(id){
  const data={
    id,
    name:document.getElementById('eu_name').value,
    username:document.getElementById('eu_username').value,
    email:document.getElementById('eu_email').value,
    branch:document.getElementById('eu_branch').value,
    role:document.getElementById('eu_role').value,
    status:document.getElementById('eu_status').value

  try{
    await A('updateUser',[T,data]);
    alert('회원 정보가 수정되었습니다.');

function categoryList(value){return String(value||'').split(/[，,;|]/).map(v=>v.trim()).filter(Boolean)}
function categoryPickerHtml(id,selected=''){
 const chosen=new Set(categoryList(selected));
 return '<div class="category-picker" id="'+E(id)+'">'+(CATS||[]).map(c=>{const raw=typeof c==='string'?c:(c.name||c.category||'');return raw?'<label><input type="checkbox" value="'+E(raw)+'" '+(chosen.has(raw)?'checked':'')+'> '+E(categoryLabel(raw))+'</label>':''}).join('')+'</div><div class="category-picker-help">해당하는 카테고리를 여러 개 선택할 수 있습니다.</div>';
}
function selectedCategories(id){return [...document.querySelectorAll('#'+id+' input[type="checkbox"]:checked')].map(x=>x.value).join(', ')}
function categoryTagsHtml(value){return categoryList(value).map(c=>'<span class="category-tag">'+E(categoryLabel(c))+'</span>').join('')}

function detectFileType(file){
  const mime=(file?.type||'').toLowerCase(), ext=(file?.name||'').split('.').pop().toLowerCase();
  if(mime==='application/pdf'||ext==='pdf')return 'PDF';
  if(mime.includes('presentation')||['ppt','pptx','key'].includes(ext))return 'PPT';
  if(mime.includes('word')||['doc','docx','hwp','hwpx'].includes(ext))return 'DOC';
  if(mime.includes('spreadsheet')||['xls','xlsx','csv'].includes(ext))return 'Excel';
  if(mime.startsWith('image/')||['jpg','jpeg','png','gif','webp','svg'].includes(ext))return '사진';
  if(mime.startsWith('video/')||['mp4','mov','avi','mkv','webm'].includes(ext))return '영상';
  if(mime.startsWith('audio/')||['mp3','wav','m4a','aac'].includes(ext))return '음성';
  if(mime.includes('zip')||['zip','rar','7z'].includes(ext))return '압축파일';
  return ext?ext.toUpperCase():'기타';
}
async function directDriveUpload(file,uploadUrl,msg){
  if(!uploadUrl)throw new Error('Google Drive 업로드 주소를 받지 못했습니다.');
  const chunkSize=3*1024*1024;
  let start=0;
  while(start<file.size){
    const end=Math.min(start+chunkSize,file.size),chunk=file.slice(start,end);
    msg.innerHTML=`<div class="notice">Google Drive에 업로드 중입니다... ${Math.round(start/file.size*100)}%</div>`;
    const proxy='/api?upload=1&url='+encodeURIComponent(uploadUrl);
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),90000);
    let r;
    try{
      r=await fetch(proxy,{method:'POST',headers:{'Content-Range':`bytes ${start}-${end-1}/${file.size}`},body:chunk,signal:ctl.signal});
    }catch(err){
      if(err?.name==='AbortError')throw new Error('파일 업로드 응답이 없습니다. 네트워크 연결을 확인해 주세요.');
      throw err;
    }finally{clearTimeout(timer)}
    if(r.status===200||r.status===201){
      let d=null;try{d=await r.json()}catch(_){}
      msg.innerHTML='<div class="notice">Google Drive 업로드 완료</div>';
      return d;
    }
    if(r.status!==308){
      let t='';try{t=await r.text()}catch(_){}
      throw new Error(t||`Google Drive 업로드 오류 (HTTP ${r.status})`);
    }
    const range=r.headers.get('Range')||r.headers.get('range')||'';
    const m=range.match(/-(\\d+)$/);
    start=m?Number(m[1])+1:end;
    msg.innerHTML=`<div class="notice">Google Drive에 업로드 중입니다... ${Math.round(start/file.size*100)}%</div>`;
  }
  return null;
}

async function upload(){
  const f=document.getElementById('file').files[0],msg=document.getElementById('uploadmsg');
  if(!f){msg.innerHTML='<div class="notice error">파일을 선택하세요.</div>';return}
  if(f.size>5*1024*1024*1024){msg.innerHTML='<div class="notice error">파일은 5GB 이하로 올려주세요.</div>';return}
  const btn=document.querySelector('button[onclick="upload()"]');
  if(btn){btn.disabled=true;btn.textContent='업로드 중...'}
  msg.innerHTML='<div class="notice">1/3 업로드를 준비하고 있습니다...</div>';
  try{
    const meta={fileName:f.name,mimeType:f.type||'application/octet-stream',size:f.size,fileType:detectFileType(f)};
    const session=await A('prepareUpload',[T,meta],45000);
    const uploadUrl=session.uploadUrl||session.uploadURL||session.url||session.location;
    if(!uploadUrl)throw new Error('업로드 주소가 없습니다. 서버의 업로드 준비 응답을 확인해야 합니다.');
    msg.innerHTML='<div class="notice">2/3 Google Drive에 파일을 업로드하고 있습니다... 0%</div>';
    const direct=await directDriveUpload(f,uploadUrl,msg);
    msg.innerHTML='<div class="notice">3/3 등록 정보를 저장하고 있습니다...</div>';
    await A('finalizeUpload',[T,{
      title:document.getElementById('mt').value,
      description:document.getElementById('md').value,
      category:selectedCategories('mc'),
      language:document.getElementById('ml').value,
      author:document.getElementById('ma').value,
      year:document.getElementById('my').value,
      fileType:detectFileType(f),
      fileName:f.name,
      size:f.size,
      uploadId:session.uploadId||session.id||'',
      driveId:direct?.id||direct?.fileId||''
    }],45000);
    msg.innerHTML='<div class="notice ok">등록되었습니다.</div>';
    alert('자료가 등록되었습니다.');
    await home();
  }catch(e){
    msg.innerHTML='<div class="notice error">업로드에 실패했습니다.<br>'+E(e.message||'알 수 없는 오류')+'</div>';
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Drive에 저장하고 등록'}
  }
}

  nav();

  <h2>비밀번호 변경</h2>${force?'<div class="notice">첫 로그인입니다. 새 비밀번호를 설정해 주세요.</div>':''}
  <div class="notice" style="line-height:1.7;margin:12px 0 18px"><strong>비밀번호 입력 안내</strong><br>새 비밀번호를 첫 번째 칸에 입력한 다음, 아래 확인 칸에 <strong>똑같은 비밀번호를 한 번 더 입력</strong>해 주세요. 두 칸의 비밀번호가 서로 같아야 변경됩니다. 비밀번호는 6자 이상이어야 합니다.</div>
  <label>현재 비밀번호</label><input id="oldpw" type="password">
  <label>새 비밀번호</label><input id="newpw" type="password" minlength="6" autocomplete="new-password">
  <label>새 비밀번호 확인 (위와 똑같이 입력)</label><input id="newpw2" type="password" minlength="6" autocomplete="new-password">
  <button class="btn" style="margin-top:16px" onclick="changePw()">변경하기</button>
  </div></div></div>`;
}

async function changePw(){
  const a=document.getElementById('oldpw').value,b=document.getElementById('newpw').value,c=document.getElementById('newpw2').value;
  if(b.length<6)return alert('새 비밀번호는 6자 이상이어야 합니다.');
  if(b!==c)return alert('새 비밀번호가 서로 다릅니다.');
  try{await A('changePassword',[T,a,b]);alert('비밀번호가 변경되었습니다.');await home()}catch(e){alert(e.message)}
}

async function logout(){
  try{if(T)await A('logout',[T])}catch(e){}
  T='';ME=null;localStorage.removeItem('gmc_token');loginPage();
}

async function boot(){
  if(!T){loginPage();return}
  try{
    const d=await A('me',[T]);
    ME=d.user||d; await home();
  }catch(e){T='';ME=null;localStorage.removeItem('gmc_token');loginPage();}
}

let gmcInstallPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();gmcInstallPrompt=e;});

document.getElementById('installAppBtn')?.addEventListener('click',async function(){
  if(gmcInstallPrompt){gmcInstallPrompt.prompt();try{await gmcInstallPrompt.userChoice;}catch(e){}gmcInstallPrompt=null;return;}
  const ua=navigator.userAgent||'';
  const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios){alert('아이폰/아이패드에서는 Safari로 이 사이트를 연 뒤 공유 버튼을 누르고 “홈 화면에 추가”를 선택하세요.');}

});
window.addEventListener('DOMContentLoaded',boot);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
