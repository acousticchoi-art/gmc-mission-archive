<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMC Mission Archive</title><style>
:root{--n:#17344f;--a:#b18a55;--bg:#f6f8fa;--line:#e4e9ee;--muted:#74808b;--white:#fff;--danger:#a33d3d;--shadow:0 8px 24px rgba(23,52,79,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#1d2a35;font-family:Arial,"Noto Sans KR",sans-serif;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
header{min-height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);gap:18px;box-shadow:0 1px 0 rgba(23,52,79,.03)}
.logo{font-weight:800;letter-spacing:.09em;font-size:15px;color:var(--n);white-space:nowrap}.logo span{font-weight:400;color:#77828d}
nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
nav button{border:0;background:transparent;color:#56616b;padding:9px 10px;border-radius:8px}.primary{color:var(--n);font-weight:700}
.hero{background:linear-gradient(135deg,#17344f 0%,#244761 100%);color:#fff;padding:34px 20px 24px}
.hero-inner,.container{width:min(1120px,100%);margin:auto}.eyebrow{font-size:11px;letter-spacing:.2em;opacity:.7}
.hero h1{font-size:clamp(36px,5vw,48px);line-height:1.08;margin:13px 0 10px;letter-spacing:-.025em}.hero p{max-width:650px;opacity:.82;margin:0;line-height:1.7}
.search{display:flex;width:100%;max-width:850px;background:#fff;border-radius:14px;overflow:hidden;margin-top:20px;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.search input{flex:1;min-width:0;border:0;padding:17px 19px;outline:0;color:#1d2a35;font-size:15px}.search button{border:0;background:var(--a);color:#fff;padding:0 27px;font-weight:bold;min-height:52px;transition:filter .15s}.search button:hover{filter:brightness(.96)}
.container{padding:38px 20px 56px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.title h2{margin:0;font-size:clamp(20px,3vw,25px);letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.cat,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.cat{padding:20px;text-align:left;min-height:92px}.cat b{display:block;margin-bottom:7px}.cat small,.meta{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.category-bar-wrap{margin-top:9px;border-top:0!important;padding-top:0!important}.hero-categories{max-width:850px}

.category-bar{display:flex;flex-wrap:nowrap;gap:0;align-items:center;overflow-x:auto;white-space:nowrap;padding:0;scrollbar-width:none}.category-bar::-webkit-scrollbar{display:none}
.category-bar button{flex:0 0 auto;border:0;background:transparent;color:rgba(255,255,255,.72);border-radius:0;padding:2px 9px;font-size:12px;line-height:1.2;transition:color .15s;text-decoration:none}.category-bar button:first-child{padding-left:0}
.category-bar button{white-space:nowrap}.category-bar button:hover{color:#fff}
.category-bar button.active{background:transparent;border-color:transparent;color:#fff;box-shadow:none;font-weight:700}
.card{padding:21px;transition:transform .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,52,79,.10)}.card h3{margin:9px 0 8px;line-height:1.4;letter-spacing:-.01em}.card p{color:var(--muted);font-size:14px;line-height:1.65;margin:0 0 12px}.tag{font-size:11px;color:var(--a);font-weight:800;letter-spacing:.02em}
.panel{padding:24px;margin-bottom:18px}.form{max-width:700px}.form label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}
.form input,.form select,.form textarea{width:100%;padding:11px;border:1px solid #ccd5dc;border-radius:8px;background:#fff;color:#1d2a35}.form textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:8px;background:var(--n);color:#fff;padding:11px 16px;font-weight:bold;display:inline-block;text-decoration:none;text-align:center}.btn.light{background:#edf2f5;color:#27343e}.btn.danger{background:var(--danger)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.notice{padding:12px;border-radius:8px;background:#eef3f6;margin:12px 0}.error{background:#fff0f0;color:#8f3030}.ok{background:#edf8f0;color:#24653b}
.login{min-height:calc(100vh - 145px);display:grid;place-items:center;padding:30px 20px}.loginbox{background:#fff;border:1px solid var(--line);border-radius:15px;padding:34px;width:min(440px,100%);box-shadow:0 12px 35px #17344f12}
.loginbox h1{margin-top:0;color:var(--n)}footer{text-align:center;padding:34px 20px 42px;color:#929ba4;font-size:12px}
@media (max-width:900px){header{padding:12px 20px;align-items:flex-start}.logo{padding-top:8px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){header{display:block;padding:13px 16px}.logo{text-align:center;padding:2px 0 9px}.logo span{font-size:11px}nav{justify-content:center;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}nav button{font-size:13px;padding:9px 8px;white-space:nowrap}.hero{padding:42px 16px 36px}.hero h1{font-size:34px}.hero p{font-size:14px}.search{flex-direction:column;border-radius:11px}.search input{padding:15px 14px;min-height:50px}.search button{width:100%;padding:14px;min-height:48px}.container{padding:28px 14px 42px}.title h2{font-size:21px}.cards,.grid{grid-template-columns:1fr;gap:12px}.card,.cat{padding:16px}.panel{padding:17px}.row{display:block}.row>*{margin-bottom:10px}.form input,.form select,.form textarea{font-size:16px;min-height:46px}.btn{min-height:44px}.login{padding:20px 14px;align-items:start;padding-top:48px}.loginbox{padding:24px 18px}}

/* v26: remove the old secondary category line */
.category-bar small:empty{display:none!important}
.category-bar .category-sub,.category-bar .category-more,.category-bar .category-note{display:none!important}
</style></head><body><header><div class="logo">GMC <span>MISSION ARCHIVE</span></div><nav id="nav"></nav></header><main id="app"></main><footer>GMC Mission Archive · Myanmar Mission Resources</footer><script>
const API='https://gmc-mission-archive.tyzm.workers.dev/api';
let T=localStorage.getItem('gmc_token')||'',ME=null,CATS=[];

async function A(action,args=[]){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args})});
  const text=await r.text(); let data;
  try{data=JSON.parse(text)}catch(e){throw new Error('서버 응답을 읽을 수 없습니다.')}
  if(!r.ok||data.ok===false)throw new Error(data.message||'요청 처리 중 오류가 발생했습니다.');
  return data;
}
const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function nav(){
  const x=document.getElementById('nav');
  if(!ME){x.innerHTML='';return}
  x.innerHTML='<button class="primary" onclick="home()">자료실</button>'+
    (ME.role==='관리자'?'<button onclick="admin()">관리자</button>':'')+
    '<button onclick="pw()">비밀번호</button><button onclick="logout()">로그아웃</button>';
}

function loginPage(message=''){
  document.getElementById('nav').innerHTML='';
  document.getElementById('app').innerHTML=`
    <div class="login"><div class="loginbox">
      <div class="eyebrow" style="color:#b18a55">GMC · MYANMAR MISSION</div>
      <h1>Mission Archive</h1>
      <p style="color:#6d7883">GMC 미얀마 선교 자료 아카이브</p>
      ${message?`<div class="notice error">${E(message)}</div>`:''}
      <form class="form" onsubmit="event.preventDefault();login()">
        <label>아이디</label><input id="username" autocomplete="username" required>
        <label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
        <button class="btn" style="width:100%;margin-top:18px" id="loginBtn">로그인</button>
      </form>
    </div></div>`;
  setTimeout(()=>document.getElementById('username')?.focus(),50);
}

async function login(){
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='로그인 중...';
  try{
    const d=await A('login',[document.getElementById('username').value.trim(),document.getElementById('password').value]);
    T=d.token||''; ME=d.user||null; localStorage.setItem('gmc_token',T);
    if(ME && (ME.firstLogin===true || ME.firstLogin==='Y' || ME.firstLogin==='예')){pw(true); return}
    await home();
  }catch(e){loginPage(e.message)}
  finally{if(document.getElementById('loginBtn')){document.getElementById('loginBtn').disabled=false;document.getElementById('loginBtn').textContent='로그인'}}
}

async function home(){
  nav();
  document.getElementById('app').innerHTML=`
  <section class="hero"><div class="hero-inner">
    <div class="eyebrow">GMC · MYANMAR MISSION</div><h1>Mission Archive</h1>
    <p>미얀마 선교의 기록과 지식을 함께 보존하고 나누는 자료 아카이브입니다.</p>
    <div class="search"><input id="q" placeholder="자료 제목, 내용, 작성자 검색" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">검색</button></div><div class="category-bar-wrap hero-categories"><div class="category-bar" id="cats"></div></div>
    <div id="heroResultCount" style="margin-top:7px;font-size:12px;opacity:.78;letter-spacing:.01em">전체 자료를 불러오는 중...</div>
  </div></section>
  <div class="container">
    
    <div class="title"><h2>검색 결과</h2></div>
    <div class="cards" id="cards"><div class="notice">자료를 불러오는 중...</div></div>
    
  </div>`;
  await Promise.all([loadCats(),search()]);
}

async function loadCats(){
  try{
    const d=await A('categories',[T]); CATS=d.categories||d.items||d.data||[];
    if(!Array.isArray(CATS))CATS=[];
    const names=CATS.map(c=>typeof c==='string'?c:(c.name||c.category||'')).filter(Boolean);
    document.getElementById('cats').innerHTML=names.map(name=>
      `<button onclick="search('${E(name).replace(/'/g,"&#039;")}')">${E(name)}</button>`
    ).join('');
  }catch(e){
    document.getElementById('cats').innerHTML='<div class="notice error">'+E(e.message)+'</div>';
  }
}

function selectCategory(btn,category=''){
  document.querySelectorAll('#cats button').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  search(category);
}

async function openMaterialById(id,url=''){
  if(url){
    window.open(url,'_blank','noopener');
    return;
  }
  if(!id)return;
  const w=window.open('about:blank','_blank');
  try{
    const d=await A('getMaterial',[T,id]);
    const m=d.material||d.item||d.data||d;
    const link=m.url||m.viewUrl||m.driveUrl||m.webViewLink||m.downloadUrl||'';
    if(link){if(w)w.location.href=link;else window.location.href=link;}
    else{if(w)w.close();alert('이 자료의 열기 링크를 찾을 수 없습니다.');}
  }catch(e){if(w)w.close();alert(e.message||'자료를 열 수 없습니다.');}
}


async function search(category=''){
  const q=document.getElementById('q')?.value.trim()||'';
  const cards=document.getElementById('cards'), count=document.getElementById('heroResultCount');
  if(!cards)return;
  cards.innerHTML='<div class="notice">검색 중...</div>';
  try{
    let d;
    // Keep compatibility with the current Worker API.
    try{d=await A('listMaterials',[T,{q,category}])}
    catch(e){d=await A('listMaterials',[T,{q,category}])}
    const items=d.materials||d.items||d.data||[];
    if(count){
      count.textContent = q
        ? `'${q}' 검색 결과 ${Array.isArray(items)?items.length:0}건`
        : (category ? `${category} 자료 ${Array.isArray(items)?items.length:0}건` : `전체 자료 ${Array.isArray(items)?items.length:0}건`);
    }
    if(!Array.isArray(items)||!items.length){cards.innerHTML='<div class="notice">검색 결과가 없습니다.</div>';return}
    cards.innerHTML=items.map(m=>`
      <article class="card" style="cursor:pointer" onclick="openMaterialById('${E(m.id||m.materialId||m.ID||'').replace(/'/g,"&#039;")}','${E(m.url||m.viewUrl||m.driveUrl||m.webViewLink||'').replace(/'/g,"&#039;")}')">
        <div class="tag">${E(m.category||'기타')}</div>
        <h3>${E(m.title||m.name||'제목 없음')}</h3>
        <p>${E(m.description||m.content||'')}</p>
        <div class="meta">${E(m.author||m.writer||'')} ${m.year?'· '+E(m.year):''}</div>
        ${m.url||m.viewUrl||m.driveUrl?`<a class="btn light" style="margin-top:12px" href="${E(m.url||m.viewUrl||m.driveUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">자료 열기</a>`:''}
      </article>`).join('');
  }catch(e){if(count)count.textContent='';cards.innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}


async function admin(){
  if(!ME || ME.role!=='관리자')return;
  document.getElementById('app').innerHTML=`<div class="container"><div class="title"><h2>관리자</h2></div>
  <div class="grid">
    <button class="cat" onclick="userAdmin()"><b>회원 관리</b><small>회원 등록·권한·상태·비밀번호 초기화</small></button>
    <button class="cat" onclick="uploadView()"><b>자료 등록</b><small>Google Drive에 파일 저장 후 자료 등록</small></button>
  </div></div>`;
}
function userAdmin(){
  document.getElementById('app').innerHTML=`<div class="container"><div class="title"><h2>회원 관리</h2><button class="btn light" onclick="admin()">← 관리자</button></div>
  <div class="panel form"><h3>회원 등록</h3>
  <div class="row"><div><label>이름</label><input id="un"></div><div><label>아이디</label><input id="uid"></div></div>
  <div class="row"><div><label>이메일</label><input id="ue"></div><div><label>소속 지부</label><input id="ub"></div></div>
  <label>권한</label><select id="ur"><option>코디네이터</option><option>지역대표</option><option>지부장</option><option>지부원</option></select>
  <label>초기 비밀번호</label><input id="up" type="password" minlength="6">
  <button class="btn" style="margin-top:16px" onclick="createUser()">회원 등록</button><div id="umsg"></div></div>
  <div class="panel"><h3>회원 목록</h3><div id="users"><div class="notice">불러오는 중...</div></div></div></div>`;
  loadUsers();
}
async function loadUsers(){
  try{
    const r=await A('listUsers',[T]);
    const users=r.users||r.items||r.data||[];
    document.getElementById('users').innerHTML=Array.isArray(users)&&users.length
      ? `<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">이름</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">아이디</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">권한</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">지부</th><th style="text-align:left;padding:9px;border-bottom:1px solid var(--line)">상태</th><th style="padding:9px;border-bottom:1px solid var(--line)">작업</th></tr>${users.map(u=>{
          const id=E(u.id||'').replace(/'/g,"&#039;");
          const active=u.status==='활성';
          return `<tr><td style="padding:9px;border-bottom:1px solid var(--line)">${E(u.name)}</td><td style="padding:9px;border-bottom:1px solid var(--line)">${E(u.username)}</td><td style="padding:9px;border-bottom:1px solid var(--line)">${E(u.role)}</td><td style="padding:9px;border-bottom:1px solid var(--line)">${E(u.branch)}</td><td style="padding:9px;border-bottom:1px solid var(--line)">${E(u.status)}</td><td style="padding:9px;border-bottom:1px solid var(--line);white-space:nowrap"><button class="btn light" onclick="editUser('${id}')">수정</button> <button class="btn light" onclick="toggleUser('${id}','${active?'비활성':'활성'}')">${active?'비활성화':'활성화'}</button></td></tr>`;
        }).join('')}</table></div>`
      : '<div class="notice">등록된 회원이 없습니다.</div>';
  }catch(e){document.getElementById('users').innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}
async function createUser(){
  const data={name:document.getElementById('un').value,username:document.getElementById('uid').value,email:document.getElementById('ue').value,branch:document.getElementById('ub').value,role:document.getElementById('ur').value,initialPassword:document.getElementById('up').value};
  try{await A('createUser',[T,data]);document.getElementById('umsg').innerHTML='<div class="notice ok">회원이 등록되었습니다.</div>';loadUsers()}
  catch(e){document.getElementById('umsg').innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}
async function toggleUser(id,status){
  if(!confirm(status==='비활성'?'이 회원을 비활성화할까요?':'이 회원을 다시 활성화할까요?'))return;
  try{
    await A('updateUser',[T,{id,status}]);
    await loadUsers();
  }catch(e){alert(e.message)}
}
async function editUser(id){
  try{
    const r=await A('listUsers',[T]);
    const u=(r.users||[]).find(x=>String(x.id)===String(id));
    if(!u)throw new Error('회원을 찾을 수 없습니다.');
    const q=v=>E(v==null?'':v);
    document.getElementById('app').innerHTML=`<div class="container"><div class="title"><h2>회원 정보 수정</h2><button class="btn light" onclick="userAdmin()">← 회원 목록</button></div>
      <div class="panel form">
        <label>이름</label><input id="eu_name" value="${q(u.name)}">
        <label>아이디</label><input id="eu_username" value="${q(u.username)}">
        <label>이메일</label><input id="eu_email" value="${q(u.email)}">
        <label>소속 지부</label><input id="eu_branch" value="${q(u.branch)}">
        <label>권한</label><select id="eu_role">${['코디네이터','지역대표','지부장','지부원'].map(x=>`<option ${x===u.role?'selected':''}>${x}</option>`).join('')}</select>
        <label>상태</label><select id="eu_status"><option ${u.status==='활성'?'selected':''}>활성</option><option ${u.status==='비활성'?'selected':''}>비활성</option></select>
        <button class="btn" style="margin-top:16px" onclick="saveUser('${E(id).replace(/'/g,"&#039;")}')">저장</button>
        <div id="eumsg"></div>
      </div></div>`;
  }catch(e){alert(e.message)}
}
async function saveUser(id){
  const data={
    id,
    name:document.getElementById('eu_name').value,
    username:document.getElementById('eu_username').value,
    email:document.getElementById('eu_email').value,
    branch:document.getElementById('eu_branch').value,
    role:document.getElementById('eu_role').value,
    status:document.getElementById('eu_status').value
  };
  try{
    await A('updateUser',[T,data]);
    alert('회원 정보가 수정되었습니다.');
    userAdmin();
  }catch(e){document.getElementById('eumsg').innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}
function uploadView(){
  document.getElementById('app').innerHTML=`<div class="container"><div class="title"><h2>자료 등록</h2><button class="btn light" onclick="admin()">← 관리자</button></div>
  <div class="panel form"><label>제목</label><input id="mt"><label>설명</label><textarea id="md"></textarea>
  <div class="row"><div><label>카테고리</label><select id="mc">${CATS.map(c=>`<option>${E(typeof c==='string'?c:(c.name||c.category||''))}</option>`).join('')}</select></div><div><label>언어</label><input id="ml" value="한국어"></div></div>
  <div class="row"><div><label>작성자</label><input id="ma"></div><div><label>작성연도</label><input id="my" value="${new Date().getFullYear()}"></div></div>
  <label>파일</label><input id="file" type="file">
  <div style="margin-top:8px;font-size:12px;color:#6b7280">파일 형식은 선택한 파일에서 자동으로 인식됩니다.</div>
  <button class="btn" style="margin-top:18px" onclick="upload()">Drive에 저장하고 등록</button><div id="uploadmsg"></div></div></div>`;
}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
function detectFileType(file){
  const mime=(file?.type||'').toLowerCase(), ext=(file?.name||'').split('.').pop().toLowerCase();
  if(mime==='application/pdf'||ext==='pdf')return 'PDF';
  if(mime.includes('presentation')||['ppt','pptx','key'].includes(ext))return 'PPT';
  if(mime.includes('word')||['doc','docx','hwp','hwpx'].includes(ext))return 'DOC';
  if(mime.includes('spreadsheet')||['xls','xlsx','csv'].includes(ext))return 'Excel';
  if(mime.startsWith('image/')||['jpg','jpeg','png','gif','webp','svg'].includes(ext))return '사진';
  if(mime.startsWith('video/')||['mp4','mov','avi','mkv','webm'].includes(ext))return '영상';
  if(mime.startsWith('audio/')||['mp3','wav','m4a','aac'].includes(ext))return '음성';
  if(mime.includes('zip')||['zip','rar','7z'].includes(ext))return '압축파일';
  return ext?ext.toUpperCase():'기타';
}
async function upload(){
  const f=document.getElementById('file').files[0],msg=document.getElementById('uploadmsg');
  if(!f){msg.innerHTML='<div class="notice error">파일을 선택하세요.</div>';return}
  msg.innerHTML='<div class="notice">업로드 중입니다. 파일 크기에 따라 시간이 걸릴 수 있습니다.</div>';
  try{
    const base64=await fileToBase64(f);
    await A('uploadMaterial',[T,{title:document.getElementById('mt').value,description:document.getElementById('md').value,category:document.getElementById('mc').value,language:document.getElementById('ml').value,author:document.getElementById('ma').value,year:document.getElementById('my').value,fileType:detectFileType(f),fileName:f.name,mimeType:f.type,base64}]);
    msg.innerHTML='';
    alert('자료가 등록되었습니다.');
    await home();
  }catch(e){msg.innerHTML='<div class="notice error">'+E(e.message)+'</div>'}
}

async function changePw(){

async function logout(){
  try{if(T)await A('logout',[T])}catch(e){}
  T='';ME=null;localStorage.removeItem('gmc_token');loginPage();
}

async function boot(){
  if(!T){loginPage();return}
  try{
    const d=await A('me',[T]);
    ME=d.user||d; await home();
  }catch(e){T='';ME=null;localStorage.removeItem('gmc_token');loginPage();}
}
window.addEventListener('DOMContentLoaded',boot);
